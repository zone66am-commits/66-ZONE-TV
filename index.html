<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تجربة البث عبر البروكسي</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 800px;
      background: #141414;
      border: 1px solid #282828;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .header {
      padding: 16px 20px;
      background: #1a1a1a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #282828;
    }
    .status-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #2a2a2a;
      color: #aaa;
    }
    .status-badge.live { background: #00875a; color: #fff; }
    .status-badge.error { background: #de350b; color: #fff; }
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      padding: 15px 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: #161616;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
    .log-box {
      padding: 15px 20px;
      background: #0f0f0f;
      border-top: 1px solid #222;
      font-family: monospace;
      font-size: 12px;
      color: #888;
      max-height: 120px;
      overflow-y: auto;
      direction: ltr;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>beIN Sports 1 (تجربة البروكسي)</h2>
      <span id="status" class="status-badge">جاري التحضير...</span>
    </div>

    <div class="video-wrapper">
      <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="controls">
      <button id="playBtn">تشغيل البث</button>
      <span style="font-size: 13px; color: #777;">إذا لم يبدأ تلقائياً، اضغط تشغيل.</span>
    </div>

    <div id="logs" class="log-box">السجلات ستظهر هنا...</div>
  </div>

  <script>
    const PROXY_WORKER = "https://vpn-hassany-zone-66.hassanyipa.workers.dev/?url=";
    // القناة التجريبية الأصلية (HTTP)
    const ORIGINAL_STREAM_URL = "http://gospeed.info:8080/live/01063411411/farid1411/1.m3u8";

    // رابط البث ممرر بالكامل عبر البروكسي
    const PROXIED_URL = PROXY_WORKER + encodeURIComponent(ORIGINAL_STREAM_URL);

    const video = document.getElementById("videoPlayer");
    const statusBadge = document.getElementById("status");
    const playBtn = document.getElementById("playBtn");
    const logs = document.getElementById("logs");

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logs.innerHTML += `<div>[${time}] ${msg}</div>`;
      logs.scrollTop = logs.scrollHeight;
      console.log(`[Player] ${msg}`);
    }

    function initPlayer() {
      log("جاري تجهيز المشغل برابط البروكسي...");

      if (Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
        });

        hls.loadSource(PROXIED_URL);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          statusBadge.textContent = "متصل بالبث";
          statusBadge.classList.add("live");
          log("تم قراءة ملف الـ Manifest بنجاح عبر البروكسي!");
          video.play().catch(e => {
            log("يتطلب تفاعل لبدء الصوت/الفيديو: " + e.message);
          });
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
          log("خطأ: " + data.type + " - " + data.details);
          if (data.fatal) {
            statusBadge.textContent = "فشل التحميل";
            statusBadge.classList.add("error");
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                log("خطأ شبكة، جاري إعادة المحاولة...");
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                log("خطأ وسائط، جاري محاولة الاستعادة...");
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                break;
            }
          }
        });

      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        // دعم متصفح Safari على أجهزة Apple
        video.src = PROXIED_URL;
        video.addEventListener("loadedmetadata", () => {
          statusBadge.textContent = "متصل (Safari)";
          statusBadge.classList.add("live");
          video.play();
        });
      } else {
        statusBadge.textContent = "المتصفح غير مدعوم";
        statusBadge.classList.add("error");
        log("المتصفح لا يدعم HLS");
      }
    }

    playBtn.onclick = () => {
      video.play().then(() => {
        log("بدأ العرض بنجاح.");
      }).catch(err => {
        log("تعذر التشغيل: " + err.message);
      });
    };

    window.onload = initPlayer;
  </script>
</body>
</html>

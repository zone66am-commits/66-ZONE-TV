<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>beIN Sports 1 | تجربة التشغيل المباشر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080808;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(145deg, #161616, #0e0e0e);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    }
    .icon-box {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: linear-gradient(145deg, #272727, #111);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: grid;
      place-items: center;
      font-size: 28px;
      color: #e50914;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    p.sub {
      color: #888;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.2s, filter 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    
    /* أزرار المشغلات */
    .btn-vlc {
      background: linear-gradient(135deg, #ff8800, #e05e00);
      color: #fff;
      box-shadow: 0 8px 24px rgba(224, 94, 0, 0.3);
    }
    .btn-stream {
      background: #2563eb;
      color: #fff;
    }
    .btn-file {
      background: rgba(255, 255, 255, 0.08);
      color: #eee;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-copy {
      background: transparent;
      color: #aaa;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      font-size: 13px;
    }
    .btn-copy:hover { color: #fff; border-color: rgba(255, 255, 255, 0.4); }

    .note {
      margin-top: 20px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      font-size: 12px;
      color: #777;
      line-height: 1.6;
    }
    .toast {
      position: fixed;
      bottom: 25px;
      background: #22c55e;
      color: #000;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 30px;
      opacity: 0;
      transform: translateY(20px);
      transition: 0.3s ease;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-box">
      <i class="fa-solid fa-tv"></i>
    </div>

    <h1>beIN Sports 1</h1>
    <p class="sub">اختر وسيلة التشغيل المفضلة على جهازك</p>

    <div class="actions">
      <!-- تشغيل عبر VLC -->
      <button class="btn btn-vlc" onclick="openVLC()">
        <i class="fa-solid fa-play"></i>
        تشغيل مباشر في تطبيق VLC
      </button>

      <!-- تحميل ملف القناة M3U -->
      <button class="btn btn-file" onclick="downloadM3U()">
        <i class="fa-solid fa-download"></i>
        تحميل ملف التشغيل (.m3u)
      </button>

      <!-- نسخ الرابط -->
      <button class="btn btn-copy" onclick="copyStreamUrl()">
        <i class="fa-regular fa-copy"></i>
        نسخ رابط البث المباشر
      </button>
    </div>

    <div class="note">
      <i class="fa-solid fa-circle-info"></i>
      التشغيل عبر VLC أو المشغلات الخارجية يفتح البث مباشرة من جهازك ويتخطى أي قيود أو حظر للمتصفحات.
    </div>
  </div>

  <div id="toast" class="toast">تم نسخ الرابط بنجاح!</div>

  <script>
    const STREAM_URL = "http://gospeed.info:8080/live/01063411411/farid1411/1.m3u8";

    function openVLC() {
      // فتح في تطبيق VLC لهواتف أيفون وأندرويد
      const vlcUrl = "vlc://" + STREAM_URL;
      window.location.href = vlcUrl;

      // إذا لم يكن التطبيق مثبت، بعد ثانيتين ينبه الزائر
      setTimeout(() => {
        if (!document.hidden) {
          alert("تأكد من تثبيت تطبيق VLC المجاني من المتجر لفتح البث بنقرة واحدة.");
        }
      }, 2000);
    }

    function downloadM3U() {
      // إنشاء ملف M3U فوري لتشغيله في أي مشغل فيديو بضغطة زر
      const m3uContent = `#EXTM3U\n#EXTINF:-1,beIN Sports 1\n${STREAM_URL}`;
      const blob = new Blob([m3uContent], { type: "audio/x-mpegurl" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "beIN_Sports_1.m3u";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function copyStreamUrl() {
      navigator.clipboard.writeText(STREAM_URL).then(() => {
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
      });
    }
  </script>
</body>
</html>
